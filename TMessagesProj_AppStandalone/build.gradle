apply plugin: 'com.android.application'

// MDGram: firma de release desde una keystore propia. La ruta/alias y la contraseña viven en
// keystore.properties (raíz del proyecto, FUERA de git). Si el archivo no existe, cae a la keystore
// por defecto de NekoX (para no romper builds de quien no tenga el archivo).
def mdKeystorePropsFile = rootProject.file("keystore.properties")
def mdKeystoreProps = new Properties()
if (mdKeystorePropsFile.exists()) {
    mdKeystoreProps.load(new FileInputStream(mdKeystorePropsFile))
}

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'

    defaultConfig.applicationId = "com.mdgram.messenger"

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            // MDGram: usa la keystore propia (keystore.properties) si existe; si no, la de NekoX.
            if (mdKeystorePropsFile.exists()) {
                storeFile file(mdKeystoreProps['RELEASE_STORE_FILE'])
                storePassword mdKeystoreProps['RELEASE_STORE_PASSWORD']
                keyAlias mdKeystoreProps['RELEASE_KEY_ALIAS']
                keyPassword mdKeystoreProps['RELEASE_KEY_PASSWORD']
            } else {
                storeFile file("../TMessagesProj/config/release.keystore")
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".web"
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            // MDGram: minify OFF en el primer release (el R8/proguard de este fork no se probó; el
            // build debug con minify off funciona 1:1). Activar a true después como optimización de
            // tamaño/ofuscación, verificando que no rompa nada.
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    // MDGram: split APKs por ABI para el release (arm64/armv7a livianos + universal). Gateado con
    // -PabiSplits para NO afectar el flujo debug diario (sin la propiedad → un solo app.apk como antes).
    // El universal (universalApk) incluye las 4 ABIs (= el de siempre); los per-ABI solo la suya.
    splits {
        abi {
            enable project.hasProperty('abiSplits')
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def mdAbi = output.getFilter(com.android.build.OutputFile.ABI)
            if (project.hasProperty('abiSplits')) {
                outputFileName = (mdAbi != null) ? "app-${mdAbi}.apk" : "app-universal.apk"
            } else {
                outputFileName = "app.apk"
            }
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionName APP_VERSION_NAME
        ndkVersion "21.4.7075529"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}
