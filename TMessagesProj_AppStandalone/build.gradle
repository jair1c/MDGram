apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.firebase.crashlytics'

import java.util.Properties

def mdgramKeystorePropertiesFile = rootProject.file('keystore.properties')
def mdgramKeystoreProperties = new Properties()
if (mdgramKeystorePropertiesFile.exists()) {
    mdgramKeystorePropertiesFile.withInputStream { stream ->
        mdgramKeystoreProperties.load(stream)
    }
}

def mdgramConfiguredStorePath = mdgramKeystoreProperties.getProperty('RELEASE_STORE_FILE', '').trim()
def mdgramConfiguredStoreFile = mdgramConfiguredStorePath ? new File(mdgramConfiguredStorePath) : null
if (mdgramConfiguredStoreFile != null && !mdgramConfiguredStoreFile.isAbsolute()) {
    mdgramConfiguredStoreFile = rootProject.file(mdgramConfiguredStorePath)
}
// A properties file copied from another PC may contain an obsolete absolute path.
// In that case, accept the same keystore filename beside keystore.properties.
if (mdgramConfiguredStoreFile != null && !mdgramConfiguredStoreFile.exists()) {
    def portableStoreFile = rootProject.file(mdgramConfiguredStoreFile.name)
    if (portableStoreFile.exists()) {
        mdgramConfiguredStoreFile = portableStoreFile
    }
}

def mdgramReleaseSigningReady = mdgramKeystorePropertiesFile.exists() &&
        mdgramConfiguredStoreFile != null && mdgramConfiguredStoreFile.exists() &&
        !mdgramKeystoreProperties.getProperty('RELEASE_STORE_PASSWORD', '').trim().isEmpty() &&
        !mdgramKeystoreProperties.getProperty('RELEASE_KEY_ALIAS', '').trim().isEmpty() &&
        !mdgramKeystoreProperties.getProperty('RELEASE_KEY_PASSWORD', '').trim().isEmpty()

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment-ktx:1.9.0'
    implementation 'androidx.core:core-ktx:1.18.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = "com.mdgram.messenger"

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        localeFilters += ["en", "ar", "de", "es", "it", "ko", "nl", "pt-rBR", "ru", "uk"]
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/release.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }

        release {
            storeFile mdgramConfiguredStoreFile ?: rootProject.file('mdgram-release.jks')
            storePassword mdgramKeystoreProperties.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias mdgramKeystoreProperties.getProperty('RELEASE_KEY_ALIAS', '')
            keyPassword mdgramKeystoreProperties.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".web"
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}

tasks.configureEach { task ->
    if (task.name == 'validateSigningAfatStandalone') {
        task.doFirst {
            if (!mdgramReleaseSigningReady) {
                throw new GradleException('Firma MDGram incompleta: coloca mdgram-release.jks junto a keystore.properties (o corrige RELEASE_STORE_FILE) antes de compilar standalone.')
            }
        }
    }
}

apply plugin: 'com.google.gms.google-services'

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}
